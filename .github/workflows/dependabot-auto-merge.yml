name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Auto-merge relies on branch protection: `gh pr merge --auto` only merges
    # once the required checks pass, and errors out if main has no protection
    # rules at all. A Claude-based review job used to run in this workflow
    # before auto-merge; it was removed in September 2026 after failing on
    # every PR for two months (expired OAuth token, upstream bugs) with
    # nothing depending on it. See CLAUDE.md.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL" --body "Auto-merging non-major update once the required CI checks pass."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
